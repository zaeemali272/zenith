# Zenith Material Design 3 theme for Yazi
# Generated dynamically by Zenith Shell

[mgr]
cwd = { fg = "#ffb785" }
hovered = { bg = "#312822", fg = "#f0dfd6" }
preview_hovered = { underline = true }
find_keyword = { fg = "#c8ca94", bold = true }
find_position = { fg = "#e4bfa8", italic = true }
marker_copied = { fg = "#ffb785", bg = "#221a15" }
marker_cut = { fg = "#ffb4ab", bg = "#221a15" }
marker_marked = { fg = "#c8ca94", bg = "#221a15" }
marker_selected = { fg = "#e4bfa8", bg = "#221a15" }
tab_active = { bg = "#ffb785", fg = "#502500" }
tab_inactive = { bg = "#261e19", fg = "#d7c3b7" }
count_copied = { fg = "#502500", bg = "#ffb785" }
count_cut = { fg = "#690005", bg = "#ffb4ab" }
count_selected = { fg = "#422b1b", bg = "#e4bfa8" }
border_style = { fg = "#52443b" }

[status]
separator_open = ""
separator_close = ""
separator_style = { fg = "#312822", bg = "#312822" }
mode_normal = { bg = "#ffb785", fg = "#502500", bold = true }
mode_select = { bg = "#e4bfa8", fg = "#422b1b", bold = true }
mode_unset = { bg = "#c8ca94", fg = "#31320b", bold = true }
progress_label = { bold = true }
progress_normal = { fg = "#ffb785", bg = "#261e19" }
progress_error = { fg = "#ffb4ab", bg = "#261e19" }
permissions_t = { fg = "#ffb785" }
permissions_r = { fg = "#e4bfa8" }
permissions_w = { fg = "#ffb4ab" }
permissions_x = { fg = "#c8ca94" }
permissions_s = { fg = "#d7c3b7" }

[select]
border = { fg = "#52443b" }
active = { fg = "#ffb785" }
inactive = { fg = "#d7c3b7" }

[input]
border = { fg = "#ffb785" }
title = { fg = "#f0dfd6" }
value = { fg = "#f0dfd6" }
selected = { bg = "#312822" }

[completion]
border = { fg = "#52443b" }
active = { bg = "#312822", fg = "#ffb785" }
inactive = { fg = "#d7c3b7" }

[tasks]
border = { fg = "#52443b" }
title = { fg = "#ffb785" }
hovered = { bg = "#312822" }

[which]
cols = 3
mask = { bg = "#140d08" }
cand = { fg = "#ffb785" }
rest = { fg = "#f0dfd6" }
desc = { fg = "#d7c3b7" }
separator = "  "
separator_style = { fg = "#9f8d83" }

[help]
on = { fg = "#ffb785" }
exec = { fg = "#c8ca94" }
desc = { fg = "#f0dfd6" }
hovered = { bg = "#312822" }
footer = { fg = "#d7c3b7", bg = "#261e19" }

[filetype]
rules = [
  { mime = "image/*", fg = "#c8ca94" },
  { mime = "audio/*", fg = "#e4bfa8" },
  { mime = "video/*", fg = "#e4bfa8" },
  { mime = "application/*zip*", fg = "#ffb4ab" },
  { mime = "application/x-{tar,bzip*,7z-compressed,xz,rar}", fg = "#ffb4ab" },
  { mime = "application/pdf", fg = "#ffb785" },
  { name = "*/", fg = "#ffb785" }
]
