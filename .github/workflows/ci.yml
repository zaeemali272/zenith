name: Zenith Validation CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    name: Lint & Validate Scripts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq shellcheck

      - name: Validate Bash syntax
        run: |
          echo "==> Checking bash script syntax..."
          while IFS= read -r f; do
            bash -n "$f" || exit 1
          done < <(find . -name "*.sh" -not -path "*/.git/*")

      - name: ShellCheck warning level
        run: |
          echo "==> Running ShellCheck..."
          find . -name "*.sh" -not -path "*/.git/*" -exec shellcheck --severity=warning {} + || true

      - name: Validate JSON files
        run: |
          echo "==> Validating JSON syntax..."
          find . -name "*.json" -not -path "*/.git/*" -exec jq empty {} +

  nix-eval:
    name: Evaluate NixOS Configurations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main

      - name: Evaluate VM Host Derivation
        run: nix eval .#nixosConfigurations.vm.config.system.build.toplevel.drvPath

      - name: Evaluate V14 Host Derivation
        run: nix eval .#nixosConfigurations.V14.config.system.build.toplevel.drvPath
